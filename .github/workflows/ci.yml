name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: cargo fmt --check
      - run: uv run --no-sync -- cargo clippy --locked --all-targets -- -D warnings
      - run: uv run --no-sync maturin build --release --locked
        if: matrix.os != 'ubuntu-latest'
      - uses: PyO3/maturin-action@v1.51.0
        if: matrix.os == 'ubuntu-latest'
        with:
          maturin-version: 1.15.0
          manylinux: "2_28"
          args: --release --locked -i python${{ matrix.python }} --compatibility pypi --out target/wheels
      - uses: actions/upload-artifact@v7
        if: matrix.os != 'ubuntu-latest'
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: target/wheels/*.whl
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: target/wheels/*manylinux*.whl

  performance:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Register benchmark runner
        run: |
          os_name="$(. /etc/os-release && echo "$PRETTY_NAME")"
          cpu="$(lscpu | awk -F: '/Model name/ {gsub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          ram="$(awk '/MemTotal/ {printf "%.0fGB", $2 / 1048576}' /proc/meminfo)"
          uv run asv machine --yes \
            --machine "github-${RUNNER_OS}-${RUNNER_ARCH}" \
            --os "$os_name" \
            --arch "$(uname -m)" \
            --cpu "$cpu" \
            --num_cpu "$(nproc)" \
            --ram "$ram"
      - name: Compare base and proposed revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if git diff --quiet "$BASE" "$HEAD" -- src python/weave Cargo.toml Cargo.lock pyproject.toml; then
            echo "Skipping ASV: no package implementation changes"
          else
            uv run asv continuous --bench 'time_(flat|wide_mixed_late|medium_mixed_late|copy_subtree(_mixed_late)?|list_replace|list_concat)_weave' --factor 1.15 --interleave-rounds --split "$BASE" "$HEAD"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asv-results-${{ github.run_id }}
          path: .asv/results
          if-no-files-found: ignore

  release-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether Cargo.toml version is untagged
        id: check
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist yet; preparing release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  sdist:
    needs: [release-check]
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*

  draft-release:
    needs: [release-check, test, sdist]
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_draft.outputs.id || steps.create_draft_fallback.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: source-distribution
          path: dist
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^## \[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if match:
                  notes = match.group(1).strip()

          if notes:
              pathlib.Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("has_notes=true\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("has_notes=false\n")
          PY
      - name: Create draft GitHub Release
        id: create_draft
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.release-check.outputs.tag }}
          name: ${{ needs.release-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: dist/*
      - name: Create draft GitHub Release (generated notes fallback)
        id: create_draft_fallback
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.release-check.outputs.tag }}
          name: ${{ needs.release-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*

  publish:
    needs: [release-check, draft-release]
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/weaved/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  seal-release:
    needs: [release-check, draft-release, publish]
    if: needs.release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release and create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f target_commitish="${TARGET_SHA}"
